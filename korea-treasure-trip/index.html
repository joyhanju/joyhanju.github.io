<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="한국 미술사 부루마블 게임 · 전자칠판이나 모둠별 태블릿 한 대로 함께 하는 보드게임">
<style>[hidden]{display:none!important}html,body{margin:0}</style>
<title>Korea Treasure Trip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* Layout: 전자칠판 3:2에 맞춘 13x9 가로형 보드. 위에 학생 입장 QR 띠, 가운데 왼쪽 주사위 무대, 오른쪽 팀 장부 */
:root{
  --ultra:#1d2f7a;
  --ultra-deep:#111a4a;
  --paper:#ffffff;
  --wash:#eef1f9;
  --ink:#1a1d2e;
  --muted:#5a6282;
  --gold:#d9a21b;
  --gold-soft:#fbf1d2;
  --line:#cfd5e6;
  --good:#1f8a4c;
  --bad:#c8333a;
  --display:'Black Han Sans','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --round:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ultra-deep);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.app{--strip:0px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%}
.app{--strip:46px}
.app.has-strip{--strip:112px}
.topbar{position:relative;width:100%;min-height:38px;display:flex;align-items:center;justify-content:center}
.menu-btn{position:absolute;right:0;top:50%;transform:translateY(-50%);border:1px solid rgba(201,162,72,.6);background:rgba(27,37,82,.9);color:#f3dfa2;border-radius:999px;padding:7px 16px;font-weight:700;font-size:15px}
.menu-btn:hover{background:#26336e}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(340px,88vw);background:#fbf7ec;box-shadow:-10px 0 30px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));border-left:4px solid #c9a248}
.dr-head{display:flex;align-items:center;justify-content:space-between}
.dr-head b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--ultra)}
.dr-x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1;color:var(--ink)}
.dr-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dr-tools .btn{padding:10px 8px;font-size:15px;background:#fff;border:1px solid var(--line)}
.drawer h3{margin:4px 0 0;font-family:var(--display);font-weight:400;font-size:18px;color:var(--ultra)}
.drawer .log{flex:1;min-height:0;font-size:14px;padding:10px 12px;gap:6px;border:1px solid var(--line);background:#fff;border-radius:12px}
.center{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr)!important;gap:1.2cqi!important;padding:1cqi 1.4cqi!important}
.center>.ledger{grid-column:1;grid-row:1;margin:0!important;display:flex;flex-direction:column;justify-content:center;gap:.5cqi}
.center>.play{grid-column:2;grid-row:1;padding:0!important;justify-content:flex-start!important;gap:.7cqi!important}
.center>.bojagi{grid-column:3;grid-row:1;margin:0!important;top:0!important;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:3cqi!important}
.center>.bojagi .bj-art{position:relative}
.tiger{position:absolute;left:18.74%;top:31.14%;width:63.16%;aspect-ratio:1;filter:drop-shadow(0 .06cqi .1cqi rgba(0,0,0,.35))}
.tiger img{position:absolute;inset:0;width:100%!important;height:100%!important;filter:none!important}
.tiger .ta{opacity:1;transition:opacity .5s ease-in-out .2s}
.tiger .tb{opacity:0;transition:opacity .5s ease-in-out}
.tiger.b .tb{opacity:1;transition:opacity .45s ease-in-out}.tiger.b .ta{opacity:0;transition:opacity .45s ease-in-out .2s}
.tiger .tc{opacity:0;transition:opacity .4s ease-in-out}
.tiger.c .tc{opacity:1;transition:opacity .35s ease-in-out}.tiger.c .ta,.tiger.c .tb{opacity:0;transition:opacity .3s ease-in-out .15s}

.center>.bojagi .bj-art{width:90%;transform-origin:50% 100%;animation:bbreath 2.8s ease-in-out infinite alternate}
.center>.bojagi .bj-art.talk{animation:bbounce .62s ease-in-out infinite}
.center>.bojagi .bj-art.hop{animation:bhop .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes bbreath{0%{transform:scale(1,1)}100%{transform:scale(1.015,.985)}}
@keyframes bbounce{0%{transform:scale(1,1) translateY(0)}22%{transform:scale(1.035,.955) translateY(0)}55%{transform:scale(.985,1.025) translateY(-3.5%)}80%{transform:scale(1.01,.99) translateY(0)}100%{transform:scale(1,1) translateY(0)}}
@keyframes bhop{0%{transform:scale(1)}25%{transform:scale(1.05,.93)}55%{transform:scale(.96,1.05) translateY(-7%)}80%{transform:scale(1.03,.97)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.stepban{animation:none!important;transform:rotate(-10deg)}.center>.bojagi .bj-art,.center>.bojagi .bj-art.talk,.center>.bojagi .bj-art.hop{animation:none}}
.center .chips{gap:.55cqi!important;flex-wrap:nowrap!important}
.turnbox{display:flex;flex-direction:column;align-items:center;gap:.7cqi}
.center>.ledger .turnbox{width:100%;margin:0 auto 1.8cqi}
.center>.ledger .turnbox .turn{font-size:1.9cqi;flex-wrap:nowrap;white-space:nowrap}
.center.tl .play .dice{margin:auto 0!important}
.center .chip{width:3cqi!important;height:3cqi!important;font-size:1.15cqi!important}
.center>.bojagi .bj-art{flex:none;height:auto}
.center>.bojagi img{width:100%!important;height:auto!important;max-height:none!important}
.center .teams{grid-template-columns:1fr!important;gap:.45cqi!important}
.center .team{width:70%!important;justify-self:center;padding:1.05cqi .8cqi!important}
.center .ledger h3,.center .ledger-note{width:70%;margin-left:auto!important;margin-right:auto!important}
.center .play .roll{margin-top:40px}
/* 둥근 글씨체(주아체): 주사위 버튼 · 지금 차례 · 팀 장부 */
.center .roll{font-family:var(--round)!important;font-weight:400!important;letter-spacing:.02em}
.center .turn,.center .turn .lbl{font-family:var(--round);font-weight:400}
.center .ledger h3,.center .team .tn,.center .team .coins{font-family:var(--round);font-weight:400}
.center .play .logo{margin-top:1.6cqi}
.center .logo{margin-top:.2cqi}
.center .logo .title-img{width:min(100%,30cqi)!important;transform:scaleX(1.2);transform-origin:50% 50%}
.board-wrap.zooming{clip-path:inset(calc(-1 * var(--topgap,0px)) 0 0 0)}
.zoomer{position:relative;transform-origin:0 0;transition:transform .55s cubic-bezier(.25,.7,.3,1);will-change:transform}
.board-wrap{position:relative;overflow:visible;border-radius:1.1cqi;container-type:inline-size;width:min(100%,calc((100vh - 46px - var(--strip)) * 1.5));min-width:min(100%,320px)}
.narrow-note{display:none;color:#c9d2f2;font-size:13px;text-align:center}
@media (max-width:760px){.narrow-note{display:block}}

/* ---------- QR strip ---------- */
.qrstrip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;max-width:100%}
.qrinfo{color:#dfe5fb;font-size:13px;line-height:1.35;text-align:right;min-width:0}
.qrinfo b{display:block;font-family:var(--display);font-weight:400;font-size:18px;color:#fff;letter-spacing:.03em}
.qrinfo .warn{color:#ffd27a}
.qr{background:#fff;border-radius:10px;padding:4px 4px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;border-top:5px solid var(--qc)}
.qr .code{width:68px;height:68px;display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center}
.qr .code svg{width:68px;height:68px;display:block}
.qr .lab{font-size:11px;font-weight:900;display:flex;align-items:center;gap:4px;max-width:76px;white-space:nowrap;overflow:hidden}
.qr .on{width:8px;height:8px;border-radius:50%;background:#c3c8d8;flex:none}
.qr.joined .on{background:var(--good)}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));
  aspect-ratio:3/2;max-width:100%;background:var(--ultra);padding:.6cqi;gap:.25cqi;border-radius:1.1cqi;
  box-shadow:0 1cqi 3cqi rgba(0,0,0,.35)}
.cell{background:var(--paper);border-radius:.45cqi;position:relative;overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:0;
  transition:box-shadow .2s, transform .2s}
.cell .band{height:1.15cqi;flex:none}
.cell .nm{font-weight:700;font-size:.95cqi;line-height:1.18;padding:.3cqi .35cqi 0;word-break:keep-all;overflow-wrap:anywhere}
.cell .ar{font-size:.78cqi;line-height:1.2;color:var(--muted);padding:.08cqi .35cqi 0;word-break:keep-all}
.cell .pr{margin-top:auto;font-size:.82cqi;padding:0 .35cqi .25cqi;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.cell.owned{box-shadow:inset 0 0 0 .42cqi var(--own)}
.cell.owned .pr{color:var(--ink)}
.cell .own{display:inline-block;padding:0 .4cqi;border-radius:.5cqi;background:var(--own);color:var(--own-t);font-size:.78cqi;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;vertical-align:bottom}
.cell.museum .nm{font-family:var(--display);font-weight:400;font-size:1.02cqi}
.cell.corner{background:var(--gold-soft);align-items:center;justify-content:center;text-align:center;padding:.35cqi}
.cell.corner .big{font-family:var(--display);font-size:1.45cqi;line-height:1.05;color:var(--ultra);word-break:keep-all}
.cell.corner .sm{font-size:.76cqi;color:var(--muted);line-height:1.25;margin-top:.35cqi;word-break:keep-all}
.cell.corner .amt{font-family:var(--display);font-size:1.25cqi;color:var(--gold);margin-top:.2cqi;font-variant-numeric:tabular-nums}
.cell.card{background:linear-gradient(160deg,#28336a,#141a3e);align-items:center;justify-content:center;text-align:center}
.cell.card .nm{font-family:var(--display);font-weight:400;color:#e2c26a;font-size:.98cqi;padding:0}
.cell.tax{background:#f4f5f9;align-items:center;justify-content:center;text-align:center}
.cell.tax .nm{padding:0}
.bj-ico{width:100%;margin:0}
.cell.card{padding:0}
.cell.card .bj-ico{position:absolute;inset:0;width:auto;display:flex;align-items:center;justify-content:center}
.cell.card .bj-ico img{width:96%!important;max-width:none;height:auto;flex:none;transform:scale(.9)}
.cell.card .bj-ico img{filter:drop-shadow(0 .25cqi .35cqi rgba(0,0,0,.55))}.bj-ico img,.bj-ico svg{display:block;width:100%;height:auto;filter:drop-shadow(0 .15cqi .2cqi rgba(0,0,0,.45))}
.cell.hit{transform:scale(1.08);z-index:2;box-shadow:0 0 0 .45cqi var(--gold),0 1cqi 2cqi rgba(0,0,0,.4)}
.cell.pickable{cursor:pointer;animation:pick 1s ease-in-out infinite alternate}
@keyframes pick{from{box-shadow:inset 0 0 0 .25cqi var(--gold)}to{box-shadow:inset 0 0 0 .6cqi var(--gold)}}
.cell.info{cursor:pointer}
.tokens{position:absolute;left:0;right:0;bottom:1.4cqi;display:flex;flex-wrap:wrap;justify-content:center;gap:.15cqi;pointer-events:none;padding:0 .2cqi}
.cell.corner .tokens{bottom:.35cqi}
.tok{width:2.1cqi;height:2.1cqi;border-radius:50%;border:.25cqi solid #fff;box-shadow:0 .2cqi .6cqi rgba(0,0,0,.45);
  font-size:1cqi;font-weight:900;display:grid;place-items:center;line-height:1}
.tok{position:relative;overflow:visible;transition:transform .25s}
.tok.moving{transform:scale(1.5);z-index:3}
.tok .pimg{position:absolute;left:50%;bottom:10%;width:190%;height:190%;object-fit:contain;object-position:bottom;transform:translateX(-50%);pointer-events:none}
.tok.now{width:2.6cqi;height:2.6cqi;animation:bob .8s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-.45cqi)}}

/* ---------- center ---------- */
.center{grid-area:2/2/9/13;background:var(--wash);border-radius:.9cqi;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1.4cqi;padding:1.3cqi;min-width:0;min-height:0;overflow:hidden}
.play{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.05cqi;text-align:center;min-width:0}
.logo{font-family:var(--display);font-size:3.9cqi;line-height:1;color:var(--ultra);letter-spacing:.02em}
.logo small{display:block;font-family:var(--body);font-size:1cqi;color:var(--muted);letter-spacing:.08em;margin-top:.5cqi;font-weight:700}
.turn{display:flex;align-items:center;gap:.8cqi;font-size:2.2cqi;font-weight:900;flex-wrap:wrap;justify-content:center}
.turn .lbl{font-size:1.05cqi;color:var(--muted);font-weight:700;letter-spacing:.05em}
.turn .dot{width:2.3cqi;height:2.3cqi;border-radius:50%;border:.3cqi solid #fff;box-shadow:0 0 0 .15cqi var(--line)}
.chips{display:flex;gap:.8cqi;flex-wrap:wrap;justify-content:center}
.chip{width:3.7cqi;height:3.7cqi;border-radius:50%;border:.32cqi solid #fff;box-shadow:0 .2cqi .6cqi rgba(0,0,0,.2);font-weight:900;font-size:1.4cqi;display:grid;place-items:center;padding:0;transition:transform .15s}
.chip.now{transform:scale(1.2);box-shadow:0 0 0 .35cqi var(--ultra),0 .3cqi .8cqi rgba(0,0,0,.3)}
.chip:disabled{opacity:.25;cursor:not-allowed}
.chip-help{font-size:.85cqi;color:var(--muted);margin-top:-.4cqi}
.dice{display:flex;gap:2.4cqi}
.die{width:8.6cqi;height:8.6cqi;background:#fff;border-radius:1.1cqi;box-shadow:0 .35cqi 0 #c7cde0,0 .6cqi 1.2cqi rgba(0,0,0,.2);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:.85cqi;gap:.3cqi}
.die span{border-radius:50%}
.die span.on{background:var(--ink)}
.die.red span.on{background:var(--bad)}
.dice.rolling .die{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-12deg)}50%{transform:rotate(12deg) translateY(-.4cqi)}100%{transform:rotate(-12deg)}}
.roll{font-family:var(--display);font-size:max(14px,2cqi);padding:.8cqi 3cqi;border-radius:999px;border:0;background:var(--ultra);color:#fff;
  box-shadow:0 .4cqi 0 #0c1440;transition:transform .1s}
.roll:active{transform:translateY(.3cqi);box-shadow:0 .15cqi 0 #0c1440}
.roll:disabled{background:#9aa3c2;box-shadow:0 .4cqi 0 #7c84a3;cursor:not-allowed}
.center .msg{display:none}
.stepban.spoken{--bw:clamp(190px,14.5vw,290px)}
.msg{font-size:max(11px,1.3cqi);font-weight:700;line-height:1.4;max-width:44cqi;min-height:2.8em;word-break:keep-all}
.stats{display:flex;gap:1.6cqi;font-size:max(10px,1cqi);color:var(--muted);font-weight:700;flex-wrap:wrap;justify-content:center}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- ledger ---------- */
.ledger{display:flex;flex-direction:column;gap:.75cqi;min-width:0;min-height:0;margin:5.2cqi 6.6cqi 1.2cqi 0}
.ledger h3{margin:0;font-family:var(--display);font-weight:400;font-size:max(12px,1.35cqi);color:var(--ultra);letter-spacing:.02em}
.tools{display:flex;gap:.5cqi;flex-wrap:wrap;justify-content:flex-end}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px;background:var(--wash);color:var(--ink)}
.btn.primary{background:var(--ultra);color:#fff}
.btn.gold{background:var(--gold);color:#2b1d00}
.btn.small{padding:.45cqi .8cqi;font-size:max(11px,.9cqi);border-radius:.6cqi;background:#fff;border:1px solid var(--line)}
.btn:hover{filter:brightness(.96)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6cqi}
.team{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.15cqi .6cqi;align-items:center;padding:.55cqi .7cqi;border-radius:.8cqi;border:.18cqi solid transparent;background:#fff;text-align:left;width:100%;color:var(--ink);min-width:0}
.team.now{border-color:var(--ultra);box-shadow:0 .2cqi .8cqi rgba(29,47,122,.22)}
.team.out{opacity:.45}
.team .dot{width:2.1cqi;height:2.1cqi;border-radius:50%;border:.22cqi solid #fff;box-shadow:0 0 0 1px var(--line);grid-row:span 2;display:grid;place-items:center;font-weight:900;font-size:.95cqi}
.team .tn{font-weight:900;font-size:max(11px,1.25cqi);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .coins{font-family:var(--display);font-size:max(12px,1.6cqi);font-variant-numeric:tabular-nums;text-align:right;grid-row:span 2}
.team .sub{font-size:max(9px,.8cqi);color:var(--muted);display:flex;gap:.35cqi;flex-wrap:wrap;min-width:0}
.tag{display:inline-block;padding:0 .45cqi;border-radius:999px;background:var(--wash);border:1px solid var(--line);font-size:max(9px,.75cqi);font-weight:700;color:var(--ink)}
.tag.warn{background:#fde8e8;border-color:#f0b4b4}
.tag.go{background:var(--gold-soft);border-color:#ecd28a}
.tag.dev{background:#e3f4ea;border-color:#a9d9bb}
.ledger-note{font-size:max(9px,.8cqi);color:var(--muted)}
.lower{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.9cqi}
.logbox{display:flex;flex-direction:column;gap:.6cqi;min-height:0;min-width:0}
.bojagi{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:0;min-width:0;padding-bottom:.3cqi}
.bojagi .bj-art{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bojagi img,.bojagi .bj-svg{max-width:100%;max-height:100%;width:auto;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 .4cqi .5cqi rgba(10,12,30,.18))}
.bojagi .bj-svg{width:100%;height:auto}
.bojagi .bj-lab{font-family:var(--display);font-size:max(11px,1.15cqi);color:#1b2552;letter-spacing:.04em}
.bojagi.shake .bj-art{animation:bjshake .5s ease-in-out}
@keyframes bjshake{0%,100%{transform:none}20%{transform:rotate(-4deg) translateY(-2%)}45%{transform:rotate(4deg) translateY(-4%)}70%{transform:rotate(-2deg)}}
.flycard{position:fixed;z-index:60;border-radius:16px;pointer-events:none;background:#1b2552 url("pieces/card-back.webp") center/100% 100% no-repeat;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.log{list-style:none;margin:0;padding:.6cqi .8cqi;display:flex;flex-direction:column;gap:.35cqi;font-size:max(10px,.92cqi);line-height:1.4;color:var(--muted);flex:1;min-height:0;overflow:auto;background:#fff;border-radius:.8cqi}
@media (prefers-reduced-motion:reduce){.bojagi.shake .bj-art{animation:none}}
.log li:first-child{color:var(--ink);font-weight:700}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(9,14,44,.62);display:grid;place-items:center;z-index:50;
  padding-block:max(16px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.modal{background:#fff;border-radius:22px;width:min(680px,100%);padding:clamp(20px,3vw,36px);box-shadow:0 20px 60px rgba(0,0,0,.4);animation:pop .22s ease-out}
.modal.flipin{animation:flipin .34s cubic-bezier(.2,.75,.3,1) both;backface-visibility:hidden}
@keyframes flipin{from{transform:perspective(1400px) rotateY(-90deg)}to{transform:perspective(1400px) rotateY(0deg)}}
.overlay.noscrim-in{animation:none}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}

  function draw(){
    if(status==='fail'){ph.innerHTML=wait('연결할 수 없어요','이 기기에서 claude.ai에 로그인되어 있는지 확인하고 QR을 다시 찍어 주세요.');return}
    if(!host){ph.innerHTML=wait('Korea Treasure Trip',`방 번호 ${esc(code)} · ${seat}번 자리<br>${status==='connecting'?'연결하는 중…':'전자칠판 화면을 기다리고 있어요.'}`);return}
    const prevIn=ph.querySelector('#phIn'),keepIn=prevIn?prevIn.value:'',focIn=prevIn&&document.activeElement===prevIn;
    const hp=host.presence,g=hp.g;
    if(g&&Array.isArray(g.ow))PH_OW=g.ow;
    if(!g||!Array.isArray(g.tm)){ph.innerHTML=wait('Korea Treasure Trip','게임 준비 중이에요.');return}
    const me=g.tm[seat-1];
    if(!me){ph.innerHTML=wait('빈 자리예요',`이번 게임에는 ${seat}번 팀이 없어요. 선생님께 알려 주세요.`);return}
    const [nm,cid,coins,pos,jail,trav,pass,out,pc]=me,cc=col(cid),now=g.tm[g.cur]||me,nc=col(now[1]);
    const myTurn=g.cur===seat-1&&g.ph!=='over'&&!out;
    if(sentAsk&&sentAsk!==hp.ask)sentAsk=null;
    const pending=sentAsk&&sentAsk===hp.ask;
    let act='';
    const mod=hp.mod;
    if(g.ph==='over')act=`<div class="ph-card ph-q"><h3>게임이 끝났어요</h3><p>${esc(g.msg||'')}</p></div>`;
    else if(mod){
      const quiz=/quiz/.test(mod.kind||''),gold=/goldcard/.test(mod.kind||'');
      act=`<div class="ph-card ph-q ${gold?'gold':''}"><h3>${esc(mod.title)}</h3>${mod.text?`<p>${esc(mod.text)}</p>`:''}
        ${myTurn&&mod.input?`<div class="ph-opts"><input id="phIn" class="ans-in" type="text" maxlength="20" autocomplete="off" placeholder="화가 이름" ${pending?'disabled':''}><button data-t="1" class="main" ${pending?'disabled':''}>정답 확인</button><button data-v="1" ${pending?'disabled':''}>모르겠어요</button></div>${pending?'<div class="ph-sent">보냈어요. 칠판을 보세요!</div>':''}`:myTurn?`<div class="ph-opts">${(mod.b||[]).map((l,i)=>`<button data-v="${i}" class="${!quiz&&i===0?'main':''}" ${pending?'disabled':''}>${esc(l)}</button>`).join('')}</div>${pending?'<div class="ph-sent">보냈어요. 칠판을 보세요!</div>':''}`:`<p>${esc(now[0])} 팀이 고르는 중이에요.</p>`}</div>`;
    }else if(myTurn&&g.ph==='roll'){
      act=`<button class="ph-big" data-v="roll" ${pending?'disabled':''}>${jail>0?'작업실 탈출 주사위':'주사위 굴리기'}</button>${pending?'<div class="ph-sent" style="color:#cfe9da">굴리는 중…</div>':''}`;
    }else if(myTurn&&g.ph==='travel'){
      act=`<div class="ph-card ph-q"><h3>문화유산 답사</h3><p>가고 싶은 칸을 골라요.</p><div class="ph-places">${SPACES.map((s,i)=>i===TRAVEL?'':`<button data-v="${i}" ${pending?'disabled':''}>${esc(title(s))}</button>`).join('')}</div>
        <div class="ph-opts" style="margin-top:10px"><button data-v="roll" ${pending?'disabled':''}>답사 대신 주사위 굴리기</button></div></div>`;
    }else if(myTurn){act=`<div class="ph-card ph-status">말이 움직이는 중이에요…</div>`}
    const own=(g.ow||[]).map((o,i)=>o===seat-1?i:-1).filter(i=>i>=0);
    ph.innerHTML=`<div class="ph-card ph-head" style="--me:${cc.c}"><span class="dot" style="background:${cc.c};color:${cc.t}">${icon(pc)}</span><span class="nm">${esc(nm)}<small style="display:block;font-family:var(--body);font-size:13px;color:var(--muted);font-weight:700">${seat}번 · ${esc(pieceName(pc))}</small></span><span class="co"><small>엽전</small>${coins}</span></div>
      <div class="ph-card ph-status">${out?'<b>파산했어요.</b> 다른 팀을 응원해 주세요.<br>':''}${myTurn?'<b>우리 팀 차례예요!</b>':`<span class="who"><i style="background:${nc.c}"></i>${esc(now[0])}</span> 차례예요`}<br><span style="color:var(--muted);font-weight:400">${esc(g.msg||'')}</span>
        <div class="ph-dice"><div class="die red">${pips(g.d[0])}</div><div class="die">${pips(g.d[1])}</div></div>
        <span style="color:var(--muted);font-size:14px">지금 위치: ${esc(title(SPACES[pos]))}${jail>0?' · 작업실':''}${trav?' · 답사 대기':''}${pass?` · 면제권 ${pass}`:''}</span></div>
      ${act}
      <div class="ph-card"><div style="font-weight:900;margin-bottom:6px">우리 팀 소장품 ${own.length}점</div>${own.length?`<ul class="ph-own">${own.map(i=>`<li>${esc(title(SPACES[i]))}</li>`).join('')}</ul>`:'<div style="color:var(--muted)">아직 없어요.</div>'}</div>`;
    ph.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const v=b.dataset.v;send(hp.ask,v==='roll'?'roll':+v)});
    const phIn=ph.querySelector('#phIn');if(phIn){phIn.value=keepIn;if(focIn)phIn.focus();
      const go=()=>send(hp.ask,'t:'+phIn.value.slice(0,20));ph.querySelector('[data-t]').onclick=go;phIn.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}}}
  }
  draw();
  (async()=>{
    try{
      const api=window.claude&&window.claude.use?await window.claude.use('room'):null;
      if(!api){status='fail';draw();return}
      proom=await api.join('artmarble-'+code);status='ok';
      proom.presence({role:'player',seat}).catch(()=>{});
      proom.onPeers(ch=>{
        const hosts=ch.peers.filter(p=>p.presence&&p.presence.role==='host'&&!p.sameTab);
        host=hosts.sort((a,b)=>b.updatedAt-a.updatedAt)[0]||null;draw();
      },()=>{status='fail';draw()});
      draw();
    }catch(e){status='fail';draw()}
  })();
}

/* ---------- 시작 ---------- */
function boot(data){
  const m=/^#r(\d{4})p([1-6])$/.exec(location.hash||'');
  if(m)return phoneMode(m[1],+m[2]);
  buildBoard();T3.init();
  const sv=(data&&data.state)||null;
  pendingSaved=(sv&&sv.phase!=='over'?sv:null)||loadSaved();
  setup.n=4;setup.play='board';setup.naming='group';newGame();openSetup();
  const intro=document.getElementById('intro');if(intro){intro.hidden=false;document.getElementById('introStart').onclick=()=>{tick&&tick(880,.1,.12);intro.classList.add('bye');setTimeout(()=>intro.remove(),750)}}
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({state}));
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>

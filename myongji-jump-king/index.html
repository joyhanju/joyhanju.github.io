// 가지 그림 색 바꾼 판 만들기: 연두·진초록·가을·꽃분홍·밤 파랑 (한 번만 만들어 둬요)
const BR_TINT = [
  ['base', ''], ['lime', 'hue-rotate(-18deg) saturate(1.35) brightness(1.12)'], ['deep', 'hue-rotate(12deg) saturate(1.1) brightness(0.82)'],
  ['autumn', 'hue-rotate(-70deg) saturate(1.6) brightness(1.05)'], ['blossom', 'hue-rotate(-140deg) saturate(1.5) brightness(1.15)'],

const BRV = {};

function branchVar(name, shape) {

// 구간마다 섞어 쓰는 잎 색
const STAGE_TINTS = [['base', 'base', 'lime', 'deep', 'blossom'], ['base', 'autumn', 'blossom', 'lime', 'autumn'], ['night', 'moon', 'base', 'night', 'blossom']];
const SPR = 0.54;   // 친구 그림 크기 (저장된 그림은 2배 크기라 0.5면 원래 크기)

let hof = store.get('mtj_hof', []); if (!Array.isArray(hof)) hof = [];
const saveSettings = () => store.set('mtj_settings', settings);
// 판 길이(낚시왕과 같은 혼잡·보통·여유): 구간 나무 높이(px)와 구간 제한 시간(초) × 3구간
const PACE = { busy: { h: 3600, t: 50, label: '혼잡' }, normal: { h: 5000, t: 70, label: '보통' }, relaxed: { h: 6800, t: 95, label: '여유' } };
const runSec = k => PACE[k].t * 3 + 3 * 7 + 40;    // 구간 3번 + 구간 사이 안내 + 안내·결과 화면
// 난이도: 가지 사이 높이, 가지 길이, 애벌레·새 많기, 도토리 간격, 양쪽 가지 확률
const DIFF = {
  easy: { gap: 100, len: [150, 215], cat: 0.12, bird: 0.6, acorn: 3.6, dbl: 0.35, label: '쉬움', sub: '가지 넓고 방해꾼 적게' },
  normal: { gap: 112, len: [130, 195], cat: 0.22, bird: 1, acorn: 2.8, dbl: 0.25, label: '보통', sub: '' },
  hard: { gap: 122, len: [110, 175], cat: 0.32, bird: 1.4, acorn: 2.0, dbl: 0.15, label: '어려움', sub: '가지 좁고 방해꾼 많이' }
};
// CPU 실력: 생각하는 간격, 움직이는 빠르기, 점프 망설임, 겨냥 오차
const CPU = {
  easy: { react: 0.55, spd: 0.55, wait: 0.55, err: 45, label: '쉬움' },
  normal: { react: 0.32, spd: 0.68, wait: 0.32, err: 28, label: '보통' },
  hard: { react: 0.14, spd: 0.9, wait: 0.08, err: 10, label: '어려움' }
};
const STAGES = [
  { name: '들판 나무', sky: ['#7cc8ff', '#d8f4ff'], top: ['#5aa9f0', '#bfe6ff'] },
  { name: '구름 나무', sky: ['#5aa0ec', '#bfe2ff'], top: ['#f0866a', '#ffd08a'] },
  { name: '밤하늘 나무', sky: ['#24306e', '#7a5c9e'], top: ['#070b26', '#1e2260'] }

const VOLS = [0, 0.25, 0.55, 0.9], VOL_LABEL = ['끔', '작게', '보통', '크게'];

// ───────── 소리 (WebAudio로 직접 합성) ─────────
const AU = { ctx: null, master: null, music: null, next: 0, step: 0 };
const mf = n => 440 * Math.pow(2, (n - 69) / 12);
function audioInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    AU.ctx = new A(); AU.master = AU.ctx.createGain(); AU.master.connect(AU.ctx.destination);
    AU.music = AU.ctx.createGain(); AU.music.gain.value = 0.3; AU.music.connect(AU.master);
    applyVol(); AU.next = AU.ctx.currentTime + 0.1;
  } catch (e) { AU.ctx = null; }
}
function applyVol() { if (AU.master) AU.master.gain.value = VOLS[settings.vol]; }
function note(f, t, d, type, v, dest, f2) {

  const o = AU.ctx.createOscillator(), gn = AU.ctx.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  gn.gain.setValueAtTime(v || 0.15, t); gn.gain.exponentialRampToValueAtTime(0.001, t + d);

}
function sfx(k) {
  if (!AU.ctx || !settings.vol) return;
  const t = AU.ctx.currentTime;
  switch (k) {
    case 'jump': note(380, t, 0.14, 'square', 0.07, null, 760); break;
    case 'stomp': note(220, t, 0.12, 'square', 0.12, null, 520); note(mf(84), t + 0.06, 0.12, 'square', 0.08); break;
    case 'hit': note(300, t, 0.3, 'sawtooth', 0.14, null, 70); break;
    case 'fruit': [72, 76, 79, 84, 88].forEach((n, i) => note(mf(n), t + i * 0.05, 0.15, 'square', 0.09)); break;
    case 'vine': note(mf(76), t, 0.06, 'triangle', 0.1); break;
    case 'tick': note(1000, t, 0.06, 'square', 0.08); break;
    case 'go': note(mf(84), t, 0.35, 'square', 0.14); break;
    case 'select': note(880, t, 0.08, 'square', 0.08, null, 1320); break;
    case 'tap': note(660, t, 0.04, 'square', 0.06); break;
    case 'star': [79, 84, 88, 91, 96].forEach((n, i) => note(mf(n), t + i * 0.07, 0.3, 'square', 0.1)); break;
    case 'win': [60, 64, 67, 72, 67, 72, 76, 79].forEach((n, i) => note(mf(n), t + i * 0.11, 0.22, 'square', 0.12)); break;

// 배경 음악: 직접 만든 밝은 반복 곡, 구간마다 조금씩 빨라져요
const BASS = [48, 48, 55, 55, 53, 53, 48, 43];
const LEAD = [72, 74, 76, 79, 76, 74, 72, 67, 69, 72, 74, 76, 74, 72, 71, 67];
function musicTick() {
  if (!AU.ctx || !settings.vol) return;
  if (game.state !== 'play') { AU.next = AU.ctx.currentTime + 0.05; return; }
  const hurry = game.timeLeft < 12;
  const st = 60 / ((hurry ? 176 : 132 + game.si * 12)) / 2, tr = game.si === 2 ? -3 : 0;
  while (AU.next < AU.ctx.currentTime + 0.15) {
    const i = AU.step % 16;

// ───────── 나무 만들기 (두 사람에게 똑같은 나무) ─────────
function genLevel(si, seed, hgt, dk) {
  const R = mulberry(seed + si * 7919), D = DIFF[dk];
  const plats = [{ x0: -40, x1: PW + 40, y: 0, k: 'ground' }], vines = [], cats = [], fruits = [], birds = [];
  let y = D.gap, side = R() < 0.5 ? -1 : 1, row = 0;
  const mk = (s, L, yy) => s < 0 ? { x0: Math.max(8, TC - 30 - L), x1: TC + 6, y: yy, k: 'branch', s } : { x0: TC - 6, x1: Math.min(PW - 8, TC + 30 + L), y: yy, k: 'branch', s };

    const L = lerp(D.len[0], D.len[1], R());
    const b = mk(side, L, y); b.tint = STAGE_TINTS[si][Math.floor(R() * 5)]; const rs = R(); b.shape = rs < [0.2, 0.32, 0.12][si] ? 2 : rs < 0.62 ? 1 : 0; if (b.shape === 2) b.tint = si === 2 ? 'night' : 'base'; b.full = 0.9 + R() * 0.45; b.extra = R() < 0.35; b.ex = R(); plats.push(b);
    if (row > 0 && R() < D.dbl) plats.push(mk(-side, L * 0.65, y));
    // 바깥쪽에 떠 있는 잎(구름) 발판
    if (row > 1 && R() < 0.3) {
      const w = 80 + R() * 30, x = b.s < 0 ? b.x0 + 10 + R() * 30 - (R() < 0.5 ? 0 : 40) : b.x1 - w - 10 - R() * 30 + (R() < 0.5 ? 0 : 40);
      const xx = clamp(x, 8, PW - 8 - w), yy = y + D.gap * 0.55;
      plats.push({ x0: xx, x1: xx + w, y: yy, k: si === 1 ? 'cloud' : 'leaf' });
      if (R() < 0.4) fruits.push({ x: xx + w / 2, y: yy + 38 });
    }
    if (row >= 2 && R() < D.cat && b.x1 - b.x0 > 150) cats.push({ p: plats.indexOf(b), ph: R() * 10, sp: 45 + R() * 40 + si * 10 });
    if (row >= 1 && R() < 0.1) fruits.push({ x: b.s < 0 ? b.x0 + 24 : b.x1 - 24, y: y + 38 });
    if (row >= 3 && R() < 0.13) {
      const vx = b.s < 0 ? b.x0 + 16 : b.x1 - 16, len = D.gap * (2 + Math.floor(R() * 2));
      vines.push({ x: vx, y0: Math.max(40, y - len), y1: y });
    }
    if (si >= 1 && row >= 2 && R() < 0.24 * D.bird) birds.push({ y: y + D.gap * 0.5, sp: 100 + R() * 80 + si * 25, ph: R() * 1000, dir: R() < 0.5 ? -1 : 1 });

function catPos(lv, c) {
  const pl = lv.plats[c.p], a = pl.x0 + 56, b = pl.x1 - 56, span = Math.max(1, b - a);
  const u = ((T * c.sp + c.ph * 100) / span) % 2, k = u < 1 ? u : 2 - u;
  return { x: a + k * span, y: pl.y, dir: u < 1 ? 1 : -1 };

  const span = PW + 200, u = (((T * b.sp + b.ph) % span) + span) % span;
  return { x: b.dir > 0 ? u - 100 : PW + 100 - u, y: b.y + Math.sin(T * 2.5 + b.ph) * 14, dir: b.dir };

// ───────── 상태 ─────────
let T = 0;
const game = { state: 'title', mode: 2, players: [], si: 0, lv: null, seed: 1, timeLeft: 0, st: 0, winner: -1, stageWin: -1, lastTick: -1, acornT: 3, acornK: 0 };
const menu = { open: false, clearArm: 0, rects: [], touchTest: false, maxTouch: 0, keyTest: false, sel: 0, rows: [], btns: [] };

// ───────── 입력 모으기 ─────────
function heldDir(p) {
  if (p.cpu) return p.cpuDir;
  let l = keysDown.has(p.i ? 'ArrowLeft' : 'KeyA'), r = keysDown.has(p.i ? 'ArrowRight' : 'KeyD');
  // 1인 플레이에서는 A·D도 오른쪽 학생이 쓸 수 있어요
  if (game.mode === 1 && p.i === 1) { l = l || keysDown.has('KeyA'); r = r || keysDown.has('KeyD'); }
  for (const pi of ptrs.values()) if (pi.pad && pi.pad.i === p.i) { if (pi.pad.k === 'L') l = true; if (pi.pad.k === 'R') r = true; }

// ───────── CPU ─────────
function cpuThink(p, lv, cfg, dt) {
  p.cpuJump = false;
  if (p.stun > 0) { p.cpuDir = 0; return; }
  if (p.climb >= 0) { p.cpuDir = 0; return; }
  p.ai.t -= dt;
  if (p.ai.t <= 0 && p.ground) {
    p.ai.t = cfg.react * rand(0.7, 1.3);
    let best = null, bs = -1e9;
    for (const pl of lv.plats) {
      if (pl.y <= p.y + 15 || pl.y > p.y + 150) continue;
      const tx = clamp(p.x, pl.x0 + 18, pl.x1 - 18), dx = Math.abs(tx - p.x);
      const s = pl.y - dx * 0.55 - (pl.k === 'goal' ? -500 : 0);
      if (s > bs) { bs = s; best = { tx, ty: pl.y }; }
    }
    for (const v of lv.vines) {
      if (v.y0 > p.y + 110 || v.y1 < p.y + 60) continue;
      const dx = Math.abs(v.x - p.x), s = v.y1 * 1.05 - dx * 0.55;
      if (s > bs) { bs = s; best = { tx: v.x, ty: Math.max(p.y + 30, v.y0 + 10) }; }
    }
    if (best) { p.ai.tx = clamp(best.tx + rand(-cfg.err, cfg.err), 14, PW - 14); p.ai.ty = best.ty; p.ai.wait = cfg.wait * rand(0.5, 1.5); }
    else { p.ai.tx = TC; p.ai.ty = p.y + 100; }
  }
  const dx = p.ai.tx - p.x;

  if (p.ground && p.on) for (let k = 0; k < lv.cats.length; k++) {
    const c = lv.cats[k]; if (lv.plats[c.p] !== p.on || p.squash[k] > T) continue;
    const q = catPos(lv, c); if (Math.abs(q.x - p.x) < 100) { p.cpuJump = true; p.cpuDir = Math.sign(q.x - p.x) || 1; return; }
  }
  // 오래 제자리면 다른 길 찾기
  if (p.best > p.ai.lb + 20) { p.ai.lb = p.best; p.ai.st = 0; } else p.ai.st = (p.ai.st || 0) + dt;
  if (p.ai.st > 3 && p.ground) { p.ai.st = 0; p.ai.lb = p.best; p.ai.tx = rand(30, PW - 30); p.ai.ty = p.y + 100; p.ai.t = 1.2; }
  // 가까워졌거나, 걷다가 가지 끝에서 떨어지기 직전이면 점프

// ───────── 친구 움직이기 ─────────
function hurt(p, from) {

  p.stun = 0.9; p.inv = 2; p.drop = 0.32; p.vy = 160; p.vx = (p.x < from ? -1 : 1) * 160; p.climb = -1; p.hits++; p.shake = 0.35;

function stepPlayer(p, dt, lv, cfg, isPlay) {
  p.shake = Math.max(0, p.shake - dt); p.inv = Math.max(0, p.inv - dt); p.drop = Math.max(0, p.drop - dt);
  p.offVine = Math.max(0, p.offVine - dt); p.boost = Math.max(0, p.boost - dt); p.anim += dt;
  if (p.cpu) cpuThink(p, lv, cfg, dt);

  let dir = canAct ? heldDir(p) : 0;
  if (p.press.j > 0 || p.cpuJump) { if (canAct) p.jbuf = 0.16; p.press.j = 0; }
  p.press.l = p.press.r = 0;
  p.jbuf = Math.max(0, p.jbuf - dt);
  if (p.stun > 0) p.stun -= dt;
  const sp = SPD * (p.cpu ? cfg.spd : 1);
  const prevY = p.y;
  if (p.climb >= 0) {
    // 덩굴 타기: 닿으면 저절로 올라가요
    const v = lv.vines[p.climb];

  } else {
    if (p.stun > 0) p.vx *= Math.pow(0.05, dt);
    else p.vx = dir * sp;
    if (dir) p.face = dir;
    // 자동 점프: 땅에 닿으면 저절로 통통 튀어요 (◀ ▶만 쓰면 돼요)
    if (settings.jump === 'auto' && !p.cpu && canAct && p.ground) p.jbuf = 0.16;
    if (p.jbuf > 0 && (p.ground || p.coyote > 0)) { p.vy = JV; p.ground = false; p.coyote = 0; p.jbuf = 0; if (!p.demo) sfx('jump'); }

  }

  // 발판에 내려앉기 (아래에서는 뚫고 올라가요)
  let landed = false;
  if (p.climb < 0 && p.vy <= 0 && p.drop <= 0) {
    for (const pl of lv.plats) {
      if (p.x + 12 > pl.x0 && p.x - 12 < pl.x1 && prevY >= pl.y - 0.01 && p.y <= pl.y) { p.y = pl.y; p.vy = 0; landed = true; p.on = pl; break; }
    }
  }
  if (p.y < 0) { p.y = 0; p.vy = 0; landed = true; p.on = lv.plats[0]; }
  p.ground = landed;
  p.coyote = landed ? 0.12 : p.coyote - dt;
  p.best = Math.max(p.best, p.y);
  // 덩굴 잡기
  if (p.climb < 0 && p.offVine <= 0 && p.stun <= 0) {
    lv.vines.forEach((v, k) => { if (p.climb < 0 && Math.abs(p.x - v.x) < 18 && p.y >= v.y0 - 12 && p.y <= v.y1 - 30) { p.climb = k; p.vy = 0; if (!p.demo) sfx('vine'); } });
  }
  // 요술 열매: 쑥쑥 날아올라요
  lv.fruits.forEach((f, k) => {
    if (p.eaten[k] || Math.abs(p.x - f.x) > 28 || Math.abs(p.y + 22 - f.y) > 34) return;
    p.eaten[k] = 1; p.fruits++; p.climb = -1; p.vy = 1450; p.boost = 1; p.inv = Math.max(p.inv, 1.2);
    if (!p.demo) { p.score += 50; sfx('fruit'); pop(p, f.x, f.y + 40, '쑥쑥!', '#ffd23f', 52); }
    burst(p, f.x, f.y, '#ffd23f', 16);
  });
  // 방해꾼
  if (p.stun <= 0) {
    lv.cats.forEach((c, k) => {
      if (p.squash[k] > T) return;
      const q = catPos(lv, c), dx = Math.abs(p.x - q.x);
      if (dx < 58 && p.vy < 0 && p.y > q.y + 4 && p.y < q.y + 30) {
        p.squash[k] = T + 5; p.vy = JV * 1.15; p.stomps++;
        if (!p.demo) { p.score += 30; sfx('stomp'); pop(p, q.x, q.y + 60, '통!', '#7dff9a', 46); }
        burst(p, q.x, q.y + 10, '#7ed957', 10);
      } else if (dx < 46 && p.y < q.y + 18 && p.y + 44 > q.y + 2) hurt(p, q.x);
    });

    for (const a of p.acorns) if (!a.hit && Math.abs(p.x - a.x) < 24 && Math.abs(p.y + 22 - a.y) < 28) { a.hit = 1; hurt(p, a.x); }
  }

  p.acorns = p.acorns.filter(a => a.y > p.y - 700 && !a.hit);
  // 카메라

}

// ───────── 화면 흐름 ─────────

function update(dt) {
  T += dt;

  parts = parts.filter(q => q.life > 0);

  musicTick();

  game.st += dt;
  if (game.state === 'title') {

    return;
  }

    const k = Math.floor(game.st);

    return;
  }

    // 밤하늘 구간: 도토리가 떨어져요 (두 사람에게 같은 자리)
    if (game.si === 2) {

    return;
  }
  if (game.state === 'result') {
    for (const p of game.players) {
      p.anim += dt;
      if (p.cpu || !p.qual || p.named) { p.press = { l: 0, r: 0, j: 0 }; continue; }
      while (p.press.l > 0) { p.press.l--; p.letters[p.li] = (p.letters[p.li] + 25) % 26; sfx('tap'); }
      while (p.press.r > 0) { p.press.r--; p.letters[p.li] = (p.letters[p.li] + 1) % 26; sfx('tap'); }
      while (p.press.j > 0) { p.press.j--; sfx('select'); p.li++; if (p.li >= 3) { p.named = true; saveName(p); break; } }
    }

  }
}

// ───────── 효과 (월드 좌표로 저장, 친구마다 따로) ─────────

const confettiList = [];

// ───────── 입력 ─────────
const GEAR = { x: 1568, y: 44, r: 24 };
// 조작 버튼: 각 반쪽 바깥 아래에 ◀ ▶, 그 위에 큰 점프
const PADS = [0, 1].map(i => {

});
const padsActive = () => ['guide', 'play', 'result', 'count', 'stageEnd'].includes(game.state);
function padHit(x, y) {
  for (let i = 0; i < 2; i++) {
    const p = game.players[i]; if (!p || p.cpu) continue;
    for (const k of ['L', 'R', 'J']) { const b = PADS[i][k]; if (Math.hypot(x - b.x, y - b.y) <= b.r + 14) return { i, k }; }
  }

}
function padPress(h) { const p = game.players[h.i]; if (!p) return; if (h.k === 'L') p.press.l++; else if (h.k === 'R') p.press.r++; else p.press.j++; }

// 키보드: P1 A·D 이동, W(Space·F) 점프 / P2 ← → 이동, ↑(Enter) 점프
const KEYS = { KeyA: [0, 'l'], KeyD: [0, 'r'], KeyW: [0, 'j'], Space: [0, 'j'], KeyF: [0, 'j'], ArrowLeft: [1, 'l'], ArrowRight: [1, 'r'], ArrowUp: [1, 'j'], Enter: [1, 'j'], NumpadEnter: [1, 'j'], Numpad0: [1, 'j'] };

// 키보드로 운영자 메뉴: ↑↓(W S) 줄 고르기 · ←→(A D) 값 바꾸기 · Enter(Space) 누르기

      g.strokeStyle = '#ffd23f'; g.lineWidth = 7; g.beginPath(); g.arc(0, 0, 62, 0, 7); g.stroke(); g.beginPath(); g.arc(0, 0, 49, 0, 7); g.stroke();
      text('승리', 0, 2, 40, '#ffd23f', FD); g.restore();
    }
    if (p.qual) {
      text(p.named ? '명예의 전당에 올랐어요!' : '명예의 전당! 이니셜을 정해요', cx, 446, 26, '#ffd23f', FD);
      for (let k = 0; k < 3; k++) {
        const bx = cx - 120 + k * 84, on = !p.named && k === p.li;
        g.fillStyle = on ? '#ffd23f' : 'rgba(255,255,255,0.12)'; rr(bx, 470, 72, 52, 12); g.fill();
        text(String.fromCharCode(65 + p.letters[k]), bx + 36, 497, 28, on ? '#2a1a00' : '#fff', FN);
      }
    } else if (!p.cpu) text(['끝까지 멋지게 올랐어요!', '점프 실력이 대단해요!', '다음엔 요술 열매를 노려 봐요!'][(p.fruits + i) % 3], cx, 470, 28, '#fff', FB);
  });
  if (game.players.some(p => p.qual && !p.named)) text(kbMode ? '글자 바꾸기 A D · ← →   |   다음 글자 W · ↑' : '◀ ▶ 글자 바꾸기 · 점프 = 다음 글자', 800, 580, 26, '#ffd23f', FB);
  text(Math.max(0, Math.ceil(25 - game.st)) + '초 뒤 첫 화면으로 돌아가요' + (kbMode ? ' · Enter: 바로 돌아가기' : ''), 800, 630, 24, 'rgba(255,255,255,0.8)', FB);
  if (game.st > 3) bigButton(640, 700, 320, 110, '처음으로', '다음 친구 차례', '#3b8c3a', () => { for (const p of game.players) saveName(p); toTitle(); });
  drawPads();
}
function drawMenu() {
  menu.rects = []; menu.rows = []; menu.btns = [];
  g.fillStyle = 'rgba(2,8,18,0.84)'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#12304a'; rr(300, 40, 1000, 820, 28); g.fill();
  g.strokeStyle = '#ffd23f'; g.lineWidth = 3; rr(300, 40, 1000, 820, 28); g.stroke();
  text('운영자 메뉴', 800, 88, 46, '#ffd23f', FD);
  text('도우미 전용 · 바꾼 설정은 이 컴퓨터에 저장돼요 · 키보드 ↑↓ ←→ Enter, Esc 닫기', 800, 128, 21, '#bfe3ff', FB);
  const row = (y, label, opts, cur, set) => {
    if (menu.sel === menu.rows.length) { g.strokeStyle = '#ffd23f'; g.lineWidth = 3; rr(326, y - 42, 948, 84, 18); g.stroke(); }
    menu.rows.push({ opts, cur, set });
    text(label, 340, y, 30, '#fff', FD, 'left');
    const n = opts.length, bw = (720 - (n - 1) * 14) / n;
    opts.forEach((o, k) => {
      const x = 540 + k * (bw + 14), on = o.v === cur;
      g.fillStyle = on ? '#ffd23f' : 'rgba(255,255,255,0.1)'; rr(x, y - 36, bw, 72, 16); g.fill();
      text(o.l, x + bw / 2, y - (o.s ? 9 : 0), 28, on ? '#2a1a00' : '#fff', FD);
      if (o.s) text(o.s, x + bw / 2, y + 20, 17, on ? '#4a3200' : '#bfe3ff', FB);
      menu.rects.push({ x, y: y - 36, w: bw, h: 72, fn: () => { set(o.v); saveSettings(); } });
    });
  };
  row(186, '판 길이', Object.keys(PACE).map(k => ({ v: k, l: PACE[k].label, s: '구간당 ' + PACE[k].t + '초 · 한 판 ' + fmtRun(runSec(k)) })), settings.pace, v => (settings.pace = v));
  row(272, '난이도', Object.keys(DIFF).map(k => ({ v: k, l: DIFF[k].label, s: DIFF[k].sub })), settings.diff, v => (settings.diff = v));
  row(358, 'CPU 실력', Object.keys(CPU).map(k => ({ v: k, l: CPU[k].label })), settings.cpu, v => (settings.cpu = v));
  row(444, '점프', [{ v: 'button', l: '버튼으로', s: '◀ ▶ + 점프, 두 손' }, { v: 'auto', l: '자동 점프', s: '◀ ▶만, 한 손' }], settings.jump, v => (settings.jump = v));
  row(530, '소리', VOL_LABEL.map((l, k) => ({ v: k, l })), settings.vol, v => { settings.vol = v; applyVol(); });
  const btns = [
    { l: '전체 화면', fn: () => { try { const d = document.documentElement, r = d.requestFullscreen || d.webkitRequestFullscreen; if (r) { const pr = r.call(d); if (pr && pr.catch) pr.catch(() => {}); } } catch (e) {} } },
    { l: '터치 테스트', fn: () => { menu.open = false; menu.touchTest = true; menu.maxTouch = 0; ptrs.clear(); } },
    { l: '키보드 안내', fn: () => { menu.open = false; menu.keyTest = true; keysDown.clear(); ptrs.clear(); } },
    { l: '처음 화면으로', fn: () => { menu.open = false; toTitle(); } },
    { l: menu.clearArm > 0 ? '한 번 더 누르면 삭제' : '명예의 전당 지우기', fn: () => { if (menu.clearArm > 0) { hof = []; store.set('mtj_hof', hof); menu.clearArm = 0; } else menu.clearArm = 3; } },
    { l: '닫기', fn: () => { menu.open = false; } }
  ];
  btns.forEach((b, k) => {
    const x = 340 + (k % 3) * 314, y = 622 + Math.floor(k / 3) * 104, bw = 294;
    g.fillStyle = k === 5 ? '#1f7fd6' : (k === 1 || k === 2) ? '#2f8a3a' : k === 4 && menu.clearArm > 0 ? '#d93a52' : 'rgba(255,255,255,0.12)'; rr(x, y, bw, 88, 18); g.fill();
    text(b.l, x + bw / 2, y + 45, b.l.length > 9 ? 24 : 30, '#fff', FD);
    menu.rects.push({ x, y, w: bw, h: 92, fn: b.fn }); menu.btns.push(b.fn);
    if (menu.sel === menu.rows.length + k) { g.strokeStyle = '#ffd23f'; g.lineWidth = 5; rr(x - 6, y - 6, bw + 12, 104, 22); g.stroke(); }
  });
}
function drawTouchTest() {
  g.fillStyle = '#0d1b2a'; g.fillRect(0, 0, W, H);
  text('터치 테스트', 800, 70, 52, '#ffd23f', FD);
  text('여러 손가락으로 화면을 동시에 눌러 보세요', 800, 130, 30, '#e3f1ff', FB);
  let k = 0; const cs = ['#ff5a76', '#3fa9ff', '#7be07b', '#ffd23f', '#ff8fb0', '#8fd3ff'];
  for (const pi of ptrs.values()) { g.fillStyle = cs[k++ % cs.length]; g.beginPath(); g.arc(pi.x, pi.y, 60, 0, 7); g.fill(); }
  text('지금 ' + ptrs.size + '개 · 최대 ' + menu.maxTouch + '개', 800, 300, 60, '#fff', FD);
  const ok = menu.maxTouch >= 4;
  text(menu.maxTouch === 0 ? '' : ok ? '좋아요! 두 사람이 터치로 할 수 있어요' : menu.maxTouch >= 2 ? '손가락이 4개 이상 인식돼야 두 사람이 편하게 할 수 있어요' : '멀티터치가 안 돼요. 키보드를 연결해 주세요', 800, 390, 32, ok ? '#7be07b' : '#ffb04a', FB);
  g.fillStyle = '#1f7fd6'; rr(620, 760, 360, 100, 22); g.fill(); text('메뉴로 돌아가기 (Esc)', 800, 810, 30, '#fff', FD);
}
function drawKeyTest() {
  g.fillStyle = '#0d1b2a'; g.fillRect(0, 0, W, H);
  text('키보드 안내', 800, 64, 52, '#ffd23f', FD);
  text('무선 키보드 하나를 두 사람이 나눠 써요. 키를 눌러 보면 불이 들어와요', 800, 118, 28, '#e3f1ff', FB);
  const cap = (x, y, w, codes, label, sub, col) => {
    const on = codes.some(c => keysDown.has(c));
    g.fillStyle = on ? col : 'rgba(255,255,255,0.1)'; rr(x, y, w, 110, 16); g.fill();
    g.strokeStyle = on ? '#fff' : 'rgba(255,255,255,0.45)'; g.lineWidth = on ? 4 : 2; rr(x, y, w, 110, 16); g.stroke();
    text(label, x + w / 2, y + 44, label.length > 2 ? 30 : 40, '#fff', FD);
    text(sub, x + w / 2, y + 86, 20, '#fff', FB);
  };
  text('P1 (왼쪽 학생)', 400, 200, 36, COL[0], FD);
  cap(310, 250, 180, ['KeyW', 'Space', 'KeyF'], 'W', '점프 (Space·F도 돼요)', COL[0]);
  cap(200, 390, 180, ['KeyA'], 'A', '왼쪽', COL[0]); cap(420, 390, 180, ['KeyD'], 'D', '오른쪽', COL[0]);
  text('P2 (오른쪽 학생)', 1200, 200, 36, COL[1], FD);
  cap(1110, 250, 180, ['ArrowUp', 'Enter', 'NumpadEnter', 'Numpad0'], '↑', '점프 (Enter도 돼요)', COL[1]);
  cap(1000, 390, 180, ['ArrowLeft'], '←', '왼쪽', COL[1]); cap(1220, 390, 180, ['ArrowRight'], '→', '오른쪽', COL[1]);
  text('동시에 누른 키: ' + keysDown.size + '개', 800, 590, 34, '#fff', FD);
  text('걸으면서 점프하려면 키 2개를 함께 눌러요. 두 사람 합쳐 4개가 함께 켜지는지 확인하세요.', 800, 640, 24, '#bfe3ff', FB);
  text('첫 화면: 1 = 1인 플레이 · 2 = 2인 대결 · M 또는 Esc = 운영자 메뉴 · 결과 화면 Enter = 처음으로', 800, 690, 22, '#bfe3ff', FB);
  g.fillStyle = '#1f7fd6'; rr(620, 790, 360, 90, 22); g.fill(); text('메뉴로 돌아가기 (Esc)', 800, 835, 28, '#fff', FD);
}

function draw() {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#0d1b2a'; g.fillRect(0, 0, cv.width, cv.height);
  g.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * ox, dpr * oy);
  g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip();
  uiRects = [];
  if (game.state === 'title') drawTitle();
  else if (game.state === 'guide') drawGuide();
  else if (game.state === 'result') drawResult();
  else drawPlay();
  if (menu.touchTest) drawTouchTest();
  else if (menu.keyTest) drawKeyTest();
  else if (menu.open) drawMenu();
  // 키보드가 안 먹을 때(화면 밖을 누른 뒤) 안내
  if (!document.hasFocus() && !menu.open && !menu.touchTest && !menu.keyTest) {
    const a = 0.75 + 0.25 * Math.sin(T * 4);
    g.globalAlpha = a; g.fillStyle = 'rgba(0,0,0,0.72)'; rr(560, 128, 480, 50, 25); g.fill(); g.globalAlpha = 1;
    text('키보드로 하려면 화면을 한 번 클릭하세요', 800, 153, 24, '#ffd23f', FB);
  }
  drawGear();
  g.restore();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try { update(dt); draw(); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
toTitle();
try { window.focus(); cv.focus({ preventScroll: true }); } catch (_) {}
if (/[?&]test(=|&|$)/.test(location.search)) window.__mt = { game, startGame, startStage, settings, update, genLevel };
requestAnimationFrame(frame);
})();
</script>
